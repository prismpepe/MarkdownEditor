<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown エディタ v__APP_VERSION__</title>
<style>
/*VENDOR_CSS*/
</style>
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --side: #f6f8fa;
  --border: #d0d7de; --accent: #0969da; --sel: #ddf4ff; --code: #f3f4f6;
  --danger: #cf222e; --head: #0550ae; --ed-size: 15px;
  /* 表示フォント（フォントの設定で変わる。--head-font は設定したときだけ入る） */
  --ui-font: "Yu Gothic UI", "Segoe UI", sans-serif;
  --edit-font: Consolas, "BIZ UDGothic", "Yu Gothic UI", monospace;
  --body-font: "Yu Gothic UI", "Segoe UI", sans-serif; --body-size: 14px;
  --code-font: Consolas, "Cascadia Mono", monospace; --code-size: 13px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --side: #161b22;
    --border: #30363d; --accent: #58a6ff; --sel: #1f3a5f; --code: #1c2128;
    --danger: #ff7b72; --head: #79c0ff;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 14px/1.5 var(--ui-font); overflow: hidden; }
button { font: inherit; padding: 5px 12px; border: 1px solid var(--border);
  background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary, button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
select, input[type=number] { font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 4px; }

#toolbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px;
  background: var(--side); border-bottom: 1px solid var(--border); }
#toolbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }
#toolbar .label { color: var(--muted); font-size: 12px; }
.group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; white-space: nowrap; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
#zoombox { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
#zoombox button { padding: 5px 9px; min-width: 32px; }
#zoombox input { width: 62px; text-align: right; }

#msg { color: var(--danger); padding: 6px 12px; border-bottom: 1px solid var(--border); }
#body { flex: 1; min-height: 0; display: flex; }
#side { width: 260px; min-width: 160px; background: var(--side);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#side.hidden { display: none; }
#side h2 { margin: 0; padding: 8px 10px 0; font-size: 12px; color: var(--muted); font-weight: 600; }
#folder { padding: 4px 10px 6px; color: var(--muted); font-size: 12px; word-break: break-all;
  border-bottom: 1px solid var(--border); }
#filter { margin: 8px; padding: 5px 8px; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; }
#count { padding: 0 10px 4px; color: var(--muted); font-size: 12px; }
#list { flex: 1; overflow-y: auto; }
.dirhead { padding: 6px 10px 2px; margin-top: 4px; font-size: 12px; font-weight: 600;
  color: var(--muted); word-break: break-all; }
.item { padding: 4px 10px; cursor: pointer; border-left: 3px solid transparent; word-break: break-all; }
.item:hover { background: var(--sel); }
.item.sel { background: var(--sel); border-left-color: var(--accent); font-weight: 600; }
.item .dir { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#top { padding: 5px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
#title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#title.dirty::before { content: "● "; color: var(--danger); }
#panes { flex: 1; min-height: 0; display: flex; }
#editorPane { flex: 0 0 50%; min-width: 0; display: flex; flex-direction: column; }
#split { flex: 0 0 6px; cursor: col-resize; background: var(--border); }
#split:hover, #split.drag { background: var(--accent); }
#previewPane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#pscroll { flex: 1; overflow: auto; }
#preview { padding: 16px 24px 64px; }
#fmt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; padding: 5px 8px;
  background: var(--bg); border-bottom: 1px solid var(--border); }
#fmt button { min-width: 30px; padding: 3px 6px; white-space: nowrap; }
#fmt select { padding: 3px 4px; }
#fmt .fgroup { display: inline-flex; align-items: center; gap: 4px; padding-right: 8px; margin-right: 4px; border-right: 1px solid var(--border); }
#fmt .fgroup:last-child { border-right: 0; }
#find { padding: 6px 8px; background: var(--side); border-bottom: 1px solid var(--border); }
#find .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
#find .frow + .frow { margin-top: 6px; }
#find input[type=text] { flex: 1 1 160px; min-width: 120px; font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
#find input[type=text].bad { border-color: var(--danger); }
#find label { font-size: 12px; color: var(--muted); white-space: nowrap; }
#find .hint { font-size: 12px; color: var(--muted); }
#fCount { font-size: 12px; color: var(--muted); margin-left: auto; }
#fCount.bad { color: var(--danger); }
#ctx { position: fixed; z-index: 20; min-width: 220px; padding: 4px; background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.28); }
#ctx[hidden] { display: none; }
#ctx .citem { display: flex; justify-content: space-between; gap: 24px; width: 100%; border: 0;
  background: none; border-radius: 4px; padding: 5px 10px; text-align: left; }
#ctx .citem:hover:not(:disabled) { background: var(--sel); }
#ctx .ckey { color: var(--muted); font-size: 12px; }
#ctx .csep { height: 1px; background: var(--border); margin: 4px 2px; }
.pane-title { padding: 3px 12px; font-size: 12px; color: var(--muted); background: var(--side);
  border-bottom: 1px solid var(--border); }

#status { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 3px 12px;
  background: var(--side); border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
#status select { font-size: 12px; padding: 1px 2px; }
#smsg { flex: 1; text-align: right; color: var(--fg); }
#smsg.warn { color: var(--danger); }

/* CodeMirror をアプリの配色に合わせる */
.CodeMirror { flex: 1; height: auto; min-height: 0; background: var(--bg); color: var(--fg);
  font: var(--ed-size)/1.65 var(--edit-font); }
#editorPane .CodeMirror { height: 100%; }
.CodeMirror-gutters { background: var(--side); border-right: 1px solid var(--border); }
.CodeMirror-linenumber { color: var(--muted); }
.CodeMirror-cursor { border-left: 2px solid var(--fg); }
.CodeMirror-selected { background: var(--sel) !important; }
.CodeMirror-focused .CodeMirror-selected { background: var(--sel) !important; }
.CodeMirror-activeline-background { background: var(--side); }
.CodeMirror-placeholder { color: var(--muted) !important; }
.cm-s-default .cm-header { color: var(--head); font-weight: 700; }
.cm-s-default .cm-strong { font-weight: 700; }
.cm-s-default .cm-em { font-style: italic; }
.cm-s-default .cm-strikethrough { text-decoration: line-through; }
.cm-s-default .cm-link, .cm-s-default .cm-url { color: var(--accent); }
.cm-s-default .cm-quote { color: var(--muted); }
.cm-s-default .cm-comment { color: #a5560f; background: var(--code); }
.cm-s-default .cm-variable-2, .cm-s-default .cm-variable-3 { color: var(--fg); }
@media (prefers-color-scheme: dark) { .cm-s-default .cm-comment { color: #ffa657; } }
.cm-s-default .cm-formatting { color: var(--muted); }
.CodeMirror-dialog { background: var(--side); color: var(--fg); border-bottom: 1px solid var(--border); padding: 4px 8px; }
.CodeMirror-dialog input { color: var(--fg); background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 6px; font: inherit; }
.CodeMirror-dialog button { padding: 1px 8px; }
.cm-searching { background: #ffd33d66; }

/* プレビュー */
#preview { font-family: var(--body-font); font-size: var(--body-size); }
#preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 { font-family: var(--head-font, inherit); }
#preview h1 { font-size: var(--h1-size, 2em); }
#preview h2 { font-size: var(--h2-size, 1.5em); }
#preview h3 { font-size: var(--h3-size, 1.17em); }
#preview h4 { font-size: var(--h4-size, 1em); }
#preview h1, #preview h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
#preview h1, #preview h2, #preview h3, #preview h4 { margin: 1.3em 0 .6em; line-height: 1.25; }
#preview > :first-child { margin-top: 0; }
#preview a { color: var(--accent); }
#preview code { background: var(--code); padding: .15em .4em; border-radius: 4px;
  font: var(--code-size) var(--code-font); }
#preview pre { background: var(--code); padding: 12px 16px; border-radius: 6px; overflow-x: auto; }
#preview pre code { padding: 0; background: none; }
#preview blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 4px solid var(--border); }
#preview table { border-collapse: collapse; margin: 1em 0; }
#preview th, #preview td { border: 1px solid var(--border); padding: 6px 12px; }
#preview th { background: var(--side); }
#preview img { max-width: 100%; }
#preview hr { border: 0; border-top: 1px solid var(--border); }
#preview li.task-list-item { list-style: none; margin-left: -1.4em; }
#preview pre.mermaid-src { background: none; padding: 0; }
#preview .diagram { text-align: center; overflow-x: auto; margin: 1em 0; }
#preview .diagram svg { max-width: 100%; height: auto; }
#preview .diagram.vega { background: #fff; border-radius: 6px; padding: 8px 0; }
#preview .diagram-error { border: 1px solid var(--danger); border-radius: 6px; padding: 8px 12px; margin: 1em 0; }
#preview .diagram-error p { margin: 0 0 6px; color: var(--danger); }
#preview .empty { color: var(--muted); }

/* 確認ダイアログ（画面内） */
#veil { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
  align-items: center; justify-content: center; z-index: 10; }
#veil.show { display: flex; }
#dlg { background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 20px 24px; width: min(520px, 90vw); box-shadow: 0 8px 30px rgba(0,0,0,.3); }
#dlg h3 { margin: 0 0 8px; font-size: 16px; }
#dlg p { margin: 0 0 16px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
#dlg .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* 印刷・PDF: 画面の部品を隠し、プレビューの本文だけを紙に流す */

/* フォントの設定ダイアログ */
#fveil { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
#fveil[hidden] { display: none; }
#fdlg { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; width: fit-content; max-width: 94vw; max-height: 90vh; overflow: auto; font: 14px/1.5 "Yu Gothic UI", "Segoe UI", sans-serif; }
#fdlg h3 { margin: 0 0 6px; }
#fdlg .hint { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
#fdlg .hint { max-width: 520px; }
#ftable { border-collapse: collapse; width: auto; }
#ftable th { text-align: left; padding: 6px 12px 6px 0; white-space: nowrap; font-weight: 600; }
#ftable td { padding: 4px 8px 4px 0; vertical-align: middle; white-space: nowrap; }
#ftable td button { padding: 4px 8px; font-size: 12px; }
#ftable input[type=text] { padding: 5px 8px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
#ftable input[list] { width: 150px; margin-right: 6px; }
.numbox { display: inline-flex; align-items: stretch; margin: 0 2px; vertical-align: middle; }
.numbox input { width: 46px; text-align: right; border-top-right-radius: 0; border-bottom-right-radius: 0; margin: 0; }
.numbox .arrows { display: flex; flex-direction: column; width: 18px; }
/* 「#ftable td button」より優先させる（余白と文字の大きさで、入力欄より背が高くならないように） */
#ftable .numbox .arrows button { flex: 1 1 0; min-height: 0; height: 0; padding: 0; margin: 0; font-size: 8px; line-height: 1;
  border-radius: 0; border-left: 0; overflow: hidden; }
#ftable .numbox .arrows button:first-child { border-top-right-radius: 6px; }
#ftable .numbox .arrows button:last-child { border-bottom-right-radius: 6px; border-top: 0; }
@media (max-width: 640px) { #ftable td:last-child:not([colspan]) { display: none; } }
#fdlg .row { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
#fdlg .grow { flex: 1; }
#fdlg button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 6px 18px; }

/* 改ページの印（印刷・PDF で効く。画面では位置が分かるよう点線で示す） */
#preview .page-break, #preview .pagebreak { height: 0; margin: 1.2em 0; border-top: 1px dashed var(--muted); position: relative; overflow: visible; }
#preview .page-break::after, #preview .pagebreak::after { content: "改ページ"; position: absolute; right: 0; top: -.7em; padding: 0 6px;
  font-size: 11px; color: var(--muted); background: var(--bg); }

@media print {
  :root { --bg: #fff; --fg: #000; --muted: #444; --side: #f2f2f2; --border: #999; --accent: #0645ad;
    --code: #f2f2f2; --head: #000; --danger: #b00; }
  html, body { height: auto !important; overflow: visible !important; display: block !important;
    background: #fff !important; color: #000 !important; }
  #toolbar, #msg, #side, #top, #editorPane, #split, .pane-title, #status, #veil, #pveil, #fveil, #ctx, #find { display: none !important; }
  #body, #main, #panes, #previewPane, #pscroll { display: block !important; overflow: visible !important;
    height: auto !important; width: auto !important; flex: none !important; min-height: 0 !important; }
  #preview { zoom: 1 !important; padding: 0 !important; }
  #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 { break-after: avoid; }
  #preview tr, #preview img, #preview .diagram, #preview blockquote, #preview li { break-inside: avoid; }
  #preview thead { display: table-header-group; }
  #preview pre { white-space: pre-wrap; word-break: break-all; overflow: visible; break-inside: avoid; }
  #preview .diagram { overflow: visible; }  #preview .page-break, #preview .pagebreak { break-after: page; height: 0 !important; margin: 0 !important; border: 0 !important; overflow: hidden; }
  #preview .page-break::after, #preview .pagebreak::after { content: none !important; }
  #preview .page-break-before { break-before: page; }
  #preview .page-break-after { break-after: page; }
  #preview .page-break-avoid { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="toolbar">
  <button id="bNew" title="Ctrl+N">📝 新規</button>
  <button id="bFolder" title="Ctrl+Shift+O">📁 フォルダーを開く</button>
  <button id="bOpen" title="Ctrl+O">📄 ファイルを開く</button>
  <span class="sep"></span>
  <button id="bSave" title="Ctrl+S">💾 保存</button>
  <button id="bSaveAs" title="Ctrl+Shift+S">名前を付けて保存</button>
  <button id="bPrint" title="Ctrl+P">🖨 印刷／PDF</button>
  <span class="sep"></span>
  <button id="bReload" title="F5">↻ 更新</button>
  <button id="btnFont" title="表示フォントの設定">🔤 フォント</button>
  <span class="sep"></span>
  <span class="group"><span class="label">表示</span>
  <span class="seg">
    <button id="vTriple" title="一覧・編集・プレビューを並べる (Ctrl+1)">3画面</button>
    <button id="vSplit" title="編集・プレビューを並べる（一覧は隠す） (Ctrl+2)">2画面</button>
    <button id="vEdit" title="編集だけを広く表示する (Ctrl+3)">編集のみ</button>
    <button id="vPrev" title="プレビューだけを広く表示する (Ctrl+4)">プレビューのみ</button>
  </span></span>
  <span class="sep"></span>
  <span id="zoombox" class="group">
    <span class="label">プレビュー倍率</span>
    <button id="zOut" title="縮小">−</button>
    <input id="zVal" type="number" min="10" max="500" step="5" value="100" title="倍率(%)を直接入力">%
    <button id="zIn" title="拡大">＋</button>
    <button id="z100" title="等倍">100%</button>
    <button id="zFit" title="プレビューを横幅いっぱいに収める (Ctrl+9)">↔ 全体表示</button>
  </span>
</div>
<div id="msg" hidden></div>
<div id="body">
  <aside id="side">
    <h2>フォルダー</h2>
    <div id="folder">未選択（「フォルダーを開く」で選びます）</div>
    <input id="filter" type="search" placeholder="🔍 ファイル名で絞り込み">
    <div id="count"></div>
    <div id="list"></div>
  </aside>
  <div id="main">
    <div id="top"><span id="title">無題</span></div>
    <div id="panes">
      <div id="editorPane">
        <div class="pane-title">編集</div>
        <div id="fmt" role="toolbar" aria-label="書式">
          <span class="fgroup">
            <button data-e="undo" title="元に戻す (Ctrl+Z)">↶</button>
            <button data-e="redo" title="やり直し (Ctrl+Y)">↷</button>
            <button data-e="cut" title="切り取り (Ctrl+X)">✂</button>
            <button data-e="copy" title="コピー (Ctrl+C)">⧉</button>
            <button data-e="paste" title="貼り付け (Ctrl+V)">📋</button>
            <button data-e="find" title="検索・置換 (Ctrl+F / Ctrl+H)">🔍</button>
          </span>
          <span class="fgroup">
            <select id="fHead" title="見出しの段階を選ぶ（同じ段階をもう一度選ぶと本文に戻る）">
              <option value="">見出し</option>
              <option value="1">見出し1（大）</option><option value="2">見出し2</option>
              <option value="3">見出し3</option><option value="4">見出し4</option>
              <option value="5">見出し5</option><option value="6">見出し6（小）</option>
              <option value="0">本文に戻す</option>
            </select>
          </span>
          <span class="fgroup">
            <button data-f="bold" title="太字 (Ctrl+B)"><b>B</b></button>
            <button data-f="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
            <button data-f="strike" title="取り消し線"><s>S</s></button>
            <button data-f="code" title="コード (Ctrl+E)">&lt;/&gt;</button>
          </span>
          <span class="fgroup">
            <button data-f="ul" title="箇条書き">• ≡</button>
            <button data-f="ol" title="番号付きリスト">1.≡</button>
            <button data-f="task" title="チェックリスト">☑</button>
            <button data-f="quote" title="引用">❝</button>
          </span>
          <span class="fgroup">
            <button data-f="link" title="リンク (Ctrl+K)">🔗</button>
            <button data-f="image" title="画像">🖼</button>
            <button data-f="table" title="表">▦</button>
            <button data-f="codeblock" title="コードブロック">{ }</button>
            <button data-f="rule" title="区切り線">―</button>
          </span>
          <span class="fgroup">
            <select id="fDiagram" title="Mermaid の図・Vega-Lite のグラフを、ひな形から挿入する"><option value="">図を挿入…</option></select>
          </span>
        </div>
        <div id="find" hidden>
          <div class="frow">
            <input id="fq" type="text" placeholder="検索する文字列" spellcheck="false">
            <button id="fPrev" title="前の一致 (Shift+Enter / Shift+F3)">▲ 前へ</button>
            <button id="fNext" title="次の一致 (Enter / F3)">▼ 次へ</button>
            <button id="fClose" title="閉じる (Esc)">✕</button>
          </div>
          <div class="frow opts">
            <label><input id="fCase" type="checkbox"> 大文字小文字を区別</label>
            <label><input id="fRegex" type="checkbox"> 正規表現</label>
            <span id="fCount"></span>
          </div>
          <div class="frow" id="rrow" hidden>
            <input id="fr" type="text" placeholder="置換後の文字列" spellcheck="false">
            <button id="fRep" title="選んでいる一致を置換して、次へ進む (Enter)">置換</button>
            <button id="fAll" title="すべて置換（1回の取り消しで戻せます）">すべて置換</button>
            <span class="hint">正規表現のときは $1 や $& が使えます</span>
          </div>
        </div>
        <textarea id="ed"></textarea>
      </div>
      <div id="split" title="ドラッグで幅を変える"></div>
      <div id="previewPane">
        <div class="pane-title">プレビュー</div>
        <div id="pscroll"><div id="preview"></div></div>
      </div>
    </div>
    <div id="status">
      <span id="pos">1行 1列</span>

<script>
const $ = id => document.getElementById(id);
let api = null, cfg = null, cm = null;
let folder = null, files = [];
const doc = { path: null, encoding: 'UTF-8', newline: 'CRLF', stamp: null,
              readonly: false, metaDirty: false };
let prefs = {};

// ============================================================ 共通部品
function showMsg(t) { const m = $('msg'); m.textContent = t || ''; m.hidden = !t; }
let smsgTimer = null;
function status(text, warn, ms = 5000) {
  const s = $('smsg'); s.textContent = text || ''; s.classList.toggle('warn', !!warn);
  clearTimeout(smsgTimer);
  if (text && ms) smsgTimer = setTimeout(() => { s.textContent = ''; }, ms);
}
const baseName = p => p ? p.substring(p.lastIndexOf('\\') + 1) : '無題';
const dirName = p => p.substring(0, p.lastIndexOf('\\'));

// 画面内の確認ダイアログ。押したボタンの番号を返す（Esc は最後のボタン＝取り消し）
function ask(title, text, buttons) {
  return new Promise(resolve => {
    $('dTitle').textContent = title; $('dText').textContent = text;
    const box = $('dBtns'); box.textContent = '';
    const done = i => { $('veil').classList.remove('show'); document.removeEventListener('keydown', onKey, true); resolve(i); };
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(buttons.length - 1); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(buttons.findIndex(b => b.primary)); }
    }
    buttons.forEach((b, i) => {
      const el = document.createElement('button'); el.textContent = b.label;
      if (b.primary) el.className = 'primary';
      el.onclick = () => done(i); box.appendChild(el);
    });
    document.addEventListener('keydown', onKey, true);
    $('veil').classList.add('show');
    box.querySelector('.primary')?.focus();
  });
}

// ============================================================ 状態表示
function isDirty() { return !cm.isClean() || doc.metaDirty; }
function updateDirty() {
  const d = isDirty();
  $('title').textContent = (doc.path || '無題') + (doc.readonly ? '（読み取り専用）' : '');
  $('title').classList.toggle('dirty', d);
  $('bSave').classList.toggle('primary', d);       // 保存が必要なときだけ青くする
  api.set_dirty(d);
  api.set_title((d ? '● ' : '') + baseName(doc.path) + ' - Markdown エディタ v__APP_VERSION__');
  updateEditButtons();
}
function updateCounters() {
  const c = cm.getCursor();
  $('pos').textContent = `${c.line + 1}行 ${c.ch + 1}列`;
  $('chars').textContent = `${cm.getValue().length.toLocaleString()}文字`;
}
let counterTimer = null;
const scheduleCounters = () => { clearTimeout(counterTimer); counterTimer = setTimeout(updateCounters, 120); };

// ============================================================ プレビュー
let renderSeq = 0, previewTimer = null, followCursor = false;
const svgCache = new Map();           // 図の記述 → 描いた SVG（打鍵のたびに描き直さない）
let mermaidReady = null, diagramSeq = 0;

function schedulePreview(delay = 200) { clearTimeout(previewTimer); previewTimer = setTimeout(updatePreview, delay); }

async function updatePreview(resetScroll) {
  const seq = ++renderSeq;
  const text = cm.getValue();
  const pv = $('pscroll'), keep = resetScroll ? 0 : pv.scrollTop;
  const html = await api.render(text, doc.path);
  if (seq !== renderSeq) return;                 // もっと新しい入力がある
  $('preview').innerHTML = html || '<p class="empty">（空の文書です）</p>';
  applyCachedDiagrams();
  applyCachedVega();
  pv.scrollTop = keep;
  if (resetScroll) { followCursor = false; pv.scrollTop = 0; }
  else if (followCursor) { followCursor = false; previewToCursor(); }
  if (fitMode) fitWidth();
  renderDiagrams(seq);
  renderVega(seq);
}

// 図の記憶は「記述＋置き場所の幅」で引く。ガントは幅で全体の大きさを決めるため、幅が変われば描き直す
const diagramKey = (el, code) => el.offsetWidth + '|' + code;

function applyCachedDiagrams() {
  document.querySelectorAll('#preview pre.mermaid-src').forEach(pre => {
    const svg = svgCache.get(diagramKey(pre, pre.textContent));
    if (svg) { const d = document.createElement('div'); d.className = 'diagram'; d.dataset.line = pre.dataset.line; d.dataset.src = pre.textContent; d.innerHTML = svg; pre.replaceWith(d); }
  });
}

function loadMermaid() {
  if (!mermaidReady) mermaidReady = api.get_mermaid().then(async src => {
    const s = document.createElement('script'); s.textContent = src; document.head.appendChild(s);
    window.mermaid.initialize(mermaidConfig());
    // Architecture Diagram の追加アイコン。同梱のアイコン集を、使われたときだけ読み込む
    const packs = await api.list_icon_packs();
    if (packs.length) window.mermaid.registerIconPacks(packs.map(name => ({ name, loader: () => api.get_icon_pack(name).then(t => JSON.parse(t)) })));
    return window.mermaid;
  });
  return mermaidReady;
}

async function renderDiagrams(seq) {
  const blocks = [...document.querySelectorAll('#preview pre.mermaid-src')];
  if (!blocks.length) return;
  let mermaid;
  try { mermaid = await loadMermaid(); } catch (e) { mermaidReady = null; status('図の描画部品を読み込めませんでした', true); return; }
  for (const pre of blocks) {
    if (seq !== renderSeq) return;
    const code = pre.textContent, id = 'mmd' + (++diagramSeq);
    const key = diagramKey(pre, code);
    // プレビューの中の本当の置き場所で描く。ガントは「親要素の幅」で全体の幅を決めるため、
    // 画面外の作業用要素で描くとウィンドウ全幅で作られ、プレビュー幅へ縮小されて文字が小さくなる
    const d = document.createElement('div'); d.className = 'diagram'; d.dataset.line = pre.dataset.line; d.dataset.src = code;
    d.style.minHeight = pre.offsetHeight + 'px';      // 描いている間、下の内容が跳ねないように
    pre.replaceWith(d);
    try {
      const { svg } = await mermaid.render(id, code, d);
      if (seq !== renderSeq) return;
      svgCache.set(key, svg);
      d.innerHTML = svg; d.style.minHeight = '';
    } catch (e) {
      document.getElementById('d' + id)?.remove();
      const box = document.createElement('div'); box.className = 'diagram-error'; box.dataset.line = pre.dataset.line;
      const p = document.createElement('p');
      p.textContent = '図を描けません: ' + String(e.message || e).split('\n')[0];
      d.replaceWith(box); box.appendChild(p); box.appendChild(pre);
    }
  }
  if (fitMode) fitWidth();
}

// ---- Vega-Lite のグラフ（```vega-lite のコードブロック）
const vegaCache = new Map();          // 文書の場所＋spec → 描いた HTML（打鍵のたびに描き直さない）
let vegaReady = null;
const vegaKey = text => (doc.path || '') + '\n' + text;
const vegaBlocks = () => [...document.querySelectorAll('#preview pre > code.language-vega-lite, #preview pre > code.language-vegalite')].map(c => c.parentElement);

function loadVega() {
  if (!vegaReady) vegaReady = (async () => {
    for (const name of ['vega', 'vega-lite', 'vega-embed']) {   // この順に読み込む
      const src = await api.get_vendor(name);
      const s = document.createElement('script'); s.textContent = src; document.head.appendChild(s);
    }
    return window.vegaEmbed;
  })();
  return vegaReady;
}

function applyCachedVega() {
  vegaBlocks().forEach(pre => {
    const html = vegaCache.get(vegaKey(pre.textContent));
    if (html == null) return;
    const d = document.createElement('div'); d.className = 'diagram vega vega-embed'; d.dataset.line = pre.dataset.line;
    d.innerHTML = html; pre.replaceWith(d);
  });
}

async function renderVega(seq) {
  const blocks = vegaBlocks();
  if (!blocks.length) return;
  let embed;
  try { embed = await loadVega(); } catch (e) { vegaReady = null; status('グラフの描画部品を読み込めませんでした', true); return; }
  // 文書内の spec による外部データ（data.url）の扱い:
  //   http(s)  … ネットから取得
  //   相対パス … 編集中の文書のフォルダーとその下の .csv/.tsv/.json だけ（Python 側で検査して読む）
  //   それ以外 … 拒否
  const loader = window.vega.loader();
  const baseLoad = loader.load;
  loader.load = async (uri, options) => {
    const u = String(uri).trim();
    if (/^https?:\/\//i.test(u)) return baseLoad.call(loader, u, options);
    const r = await api.read_data(u);
    if (r.error) throw new Error(r.error);
    return r.text;
  };
  for (const pre of blocks) {
    if (seq !== renderSeq) return;
    const text = pre.textContent;
    const d = document.createElement('div'); d.className = 'diagram vega'; d.dataset.line = pre.dataset.line;
    d.style.minHeight = pre.offsetHeight + 'px';
    pre.replaceWith(d);
    try {
      const spec = JSON.parse(text);
      await embed(d, spec, { renderer: 'svg', actions: false, loader, config: vegaConfig() });
      if (seq !== renderSeq) return;
      vegaCache.set(vegaKey(text), d.innerHTML); d.style.minHeight = '';
    } catch (e) {
      const box = document.createElement('div'); box.className = 'diagram-error'; box.dataset.line = pre.dataset.line;
      const p = document.createElement('p');
      p.textContent = 'グラフを描けません: ' + String(e.message || e).split('\n')[0];
      d.replaceWith(box); box.appendChild(p); box.appendChild(pre);
    }
  }
  if (fitMode) fitWidth();
}
// 別のアプリでデータファイルを直したあと、戻ってきたときに描き直す
window.addEventListener('focus', () => {
  if (!vegaCache.size) return;
  vegaCache.clear();
  if (document.querySelector('#preview .diagram.vega')) schedulePreview(0);
});

// ---- 編集とプレビューの位置合わせ（プレビューの data-line を目印にする）
function previewYForLine(line) {
  const pv = $('pscroll');
  const a = [...document.querySelectorAll('#preview [data-line]')]
    .map(el => ({ line: +el.dataset.line, el })).sort((x, y) => x.line - y.line);
  if (!a.length) return 0;
  let i = -1;
  for (let k = 0; k < a.length; k++) { if (a[k].line <= line) i = k; else break; }
  const yOf = el => el.getBoundingClientRect().top - pv.getBoundingClientRect().top + pv.scrollTop;
  if (i < 0) return 0;
  const y0 = yOf(a[i].el);
  const nxt = a[i + 1];
  if (!nxt) return y0;
  const frac = Math.min(1, (line - a[i].line) / Math.max(1, nxt.line - a[i].line));
  return y0 + (yOf(nxt.el) - y0) * frac;
}
function syncFromTop() {                       // 編集側のスクロールにプレビューを合わせる
  if (prefs.view === 'edit') return;
  const top = cm.lineAtHeight(cm.getScrollInfo().top, 'local');
  $('pscroll').scrollTop = previewYForLine(top);
}
function previewToCursor() {                   // 打鍵中は、書いている場所をプレビューに出す
  const pv = $('pscroll');
  pv.scrollTop = Math.max(0, previewYForLine(cm.getCursor().line) - pv.clientHeight * 0.3);
}

// ---- プレビューの倍率
let zoom = 1, fitMode = false;
const Z_MIN = 0.1, Z_MAX = 5;
function setZoom(z, fit) {
  zoom = Math.min(Z_MAX, Math.max(Z_MIN, z)); fitMode = !!fit;
  $('preview').style.zoom = zoom;
  $('zVal').value = Math.round(zoom * 100);
  $('zFit').classList.toggle('active', fitMode);
  savePrefsSoon();
}
const overflowing = () => $('pscroll').scrollWidth > $('pscroll').clientWidth + 1;
function fitWidth() {
  setZoom(1, true);
  if (!overflowing()) return;
  let lo = Z_MIN, hi = 1;
  for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; $('preview').style.zoom = mid; if (overflowing()) hi = mid; else lo = mid; }
  setZoom(lo, true);
}
const zoomBy = f => setZoom(Math.round(zoom * f * 100) / 100, false);

// ---- 設定（フォント・前回の状態の復元）
let prefsReady = false, prefsTimer = null;
const FONT_PARTS = {
  ui:      { label: '画面', family: '"Yu Gothic UI", "Segoe UI", sans-serif', size: 14, min: 8, max: 40 },
  editor:  { label: '編集欄', family: 'Consolas, "BIZ UDGothic", "Yu Gothic UI", monospace', size: 15, min: 8, max: 60 },
  body:    { label: '本文',                     family: '"Yu Gothic UI", "Segoe UI", sans-serif', size: 14, min: 8, max: 60 },
  head:    { label: '見出し',                   family: '' },
  code:    { label: 'コード',                   family: 'Consolas, "Cascadia Mono", monospace',  size: 13, min: 8, max: 60 },
  diagram: { label: '図・グラフ',               family: '"trebuchet ms", verdana, arial, sans-serif', size: 16, min: 8, max: 60 },
};
const GENERIC_FONTS = new Set(['serif', 'sans-serif', 'monospace', 'cursive', 'fantasy', 'system-ui', 'ui-serif', 'ui-sans-serif', 'ui-monospace']);
function cssFamily(s) {                 // 入力されたフォント名を、CSS に安全に入れられる形にする
  if (!s) return '';
  const n = String(s).split(',').map(x => x.replace(/["'`;{}<>\\\r\n\t]/g, '').trim()).find(Boolean);   // 1つだけ使う
  if (!n) return '';
  return GENERIC_FONTS.has(n.toLowerCase()) ? n.toLowerCase() : '"' + n + '"';
}
const fontPref = part => (prefs.fonts && prefs.fonts[part]) || {};

function mermaidConfig(theme) {         // 既定値も毎回すべて渡す（前の設定が残らないように）
  const d = fontPref('diagram'), size = d.size || FONT_PARTS.diagram.size;
  const fam = cssFamily(d.family) || FONT_PARTS.diagram.family;
  const k = size / FONT_PARTS.diagram.size;
  return {
    startOnLoad: false, securityLevel: 'strict',
    theme: theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'),
    fontFamily: fam,
    themeVariables: { fontFamily: fam, fontSize: size + 'px' },
    gantt: { fontSize: Math.round(11 * k), sectionFontSize: Math.round(11 * k), barHeight: Math.round(20 * k), barGap: Math.round(4 * k) },
  };
}
function vegaConfig() {
  // 軸・凡例・タイトル・見出し・文字の各部分に、名前と大きさを渡す（Vega-Lite の既定の大きさに、Mermaid と同じ倍率を掛ける）。
  // 設定していない項目は渡さず、Vega-Lite の既定のままにする。spec 自身が config や fontSize を持つときは、そちらが優先される
  const d = fontPref('diagram'), fam = cssFamily(d.family);
  const cfg = { background: '#ffffff' };
  if (fam) cfg.font = fam;
  if (!fam && !d.size) return cfg;
  const k = (d.size || FONT_PARTS.diagram.size) / FONT_PARTS.diagram.size, px = n => Math.round(n * k * 10) / 10;
  const f = (label, title) => {
    const o = {};
    if (fam) { if (label) o[label[0]] = fam; if (title) o[title[0]] = fam; }
    if (d.size) { if (label) o[label[1]] = px(label[2]); if (title) o[title[1]] = px(title[2]); }
    return o;
  };
  cfg.axis = f(['labelFont', 'labelFontSize', 10], ['titleFont', 'titleFontSize', 11]);
  cfg.legend = f(['labelFont', 'labelFontSize', 10], ['titleFont', 'titleFontSize', 11]);
  cfg.header = f(['labelFont', 'labelFontSize', 10], ['titleFont', 'titleFontSize', 10]);
  cfg.title = fam ? { font: fam, subtitleFont: fam } : {};
  if (d.size) { cfg.title.fontSize = px(13); cfg.title.subtitleFontSize = px(12); cfg.text = { fontSize: px(11) }; }
  if (fam) cfg.text = Object.assign(cfg.text || {}, { font: fam });
  return cfg;
}

const edSize = () => fontPref('editor').size || FONT_PARTS.editor.size;
function applyFonts() {
  const root = document.documentElement.style;
  const put = (name, v) => v ? root.setProperty(name, v) : root.removeProperty(name);
  put('--ui-font', cssFamily(fontPref('ui').family));
  put('--edit-font', cssFamily(fontPref('editor').family));
  put('--body-font', cssFamily(fontPref('body').family));
  put('--head-font', cssFamily(fontPref('head').family));
  put('--code-font', cssFamily(fontPref('code').family));
  const hs = fontPref('head').sizes || {};
  for (const l of ['h1', 'h2', 'h3', 'h4']) put('--' + l + '-size', hs[l] ? hs[l] + 'px' : '');
  put('--ed-size', fontPref('editor').size ? fontPref('editor').size + 'px' : '');
  put('--body-size', fontPref('body').size ? fontPref('body').size + 'px' : '');
  put('--code-size', fontPref('code').size ? fontPref('code').size + 'px' : '');
  const k = (fontPref('ui').size || FONT_PARTS.ui.size) / FONT_PARTS.ui.size;   // 画面の部品は、全体を拡大縮小して大きさを合わせる
  for (const id of ['toolbar', 'side', 'top', 'status', 'fmt']) $(id).style.zoom = k === 1 ? '' : k;
  svgCache.clear(); vegaCache.clear();          // 図の文字が変わるので、描いたものの記憶は使えない
  if (window.mermaid) window.mermaid.initialize(mermaidConfig());
  if (typeof cm !== 'undefined' && cm) cm.refresh();    // 文字の幅が変わるので、編集欄の寸法を測り直す
  if (fitMode) fitWidth();
}

function savePrefsSoon() {              // 表示倍率は、変えたあと少し待ってまとめて保存する
  if (!prefsReady || !api) return;
  clearTimeout(prefsTimer);
  prefsTimer = setTimeout(() => {
    prefs.zoom = { value: zoom, fit: fitMode };
    api.set_prefs({ zoom: prefs.zoom });
  }, 400);
}

// ---- フォントの設定ダイアログ
let fontListLoaded = false;
const fontDlgOpen = () => !$('fveil').hidden;
function closeFontDlg() { $('fveil').hidden = true; }

function refreshSamples() {
  for (const part of Object.keys(FONT_PARTS)) {
    const el = document.querySelector(`[data-sample="${part}"]`); if (!el) continue;
    const spec = FONT_PARTS[part], p = fontPref(part);
    const fam = cssFamily(p.family) || (part === 'head' ? cssFamily(fontPref('body').family) || FONT_PARTS.body.family : spec.family);
    el.style.fontFamily = fam;
    el.style.fontSize = Math.min(28, part === 'head' ? ((p.sizes || {}).h2 || 21) : (p.size || spec.size || 16)) + 'px';
    el.style.fontWeight = part === 'head' ? '700' : '400';
  }
}
// 数値の入力欄。ブラウザー標準の ▲▼ は、空欄から押すと最小値になってしまうので、
// 既定の大きさから増減する ▲▼ を自前で付ける（キーボードの ↑↓ も同じ）
function makeNumberBox(opts) {          // opts: { part, kind, level, min, max, value, dflt(): 既定の数, placeholder, title }
  const wrap = document.createElement('span'); wrap.className = 'numbox';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'numeric'; inp.autocomplete = 'off';
  inp.value = opts.value || ''; inp.placeholder = opts.placeholder || '';
  if (opts.title) inp.title = opts.title;
  inp.dataset.part = opts.part; inp.dataset.kind = opts.kind;
  if (opts.level) inp.dataset.level = opts.level;
  const step = d => {
    const base = parseInt(inp.value, 10) || opts.dflt();
    inp.value = Math.min(opts.max, Math.max(opts.min, base + d));
    inp.dispatchEvent(new Event('change', { bubbles: true }));
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); step(-1); }
  });
  const arrows = document.createElement('span'); arrows.className = 'arrows';
  for (const [txt, d] of [['▲', 1], ['▼', -1]]) {
    const b = document.createElement('button'); b.type = 'button'; b.tabIndex = -1; b.textContent = txt;
    b.onclick = () => step(d); arrows.appendChild(b);
  }
  wrap.appendChild(inp); wrap.appendChild(arrows);
  return wrap;
}
const HEAD_DEFAULT_RATIO = { h1: 2, h2: 1.5, h3: 1.17, h4: 1 };

function resetPart(part) {              // 1つの部分（名前と大きさのすべて）を既定に戻す
  prefs.fonts = { ...prefs.fonts }; delete prefs.fonts[part];
  api.set_prefs({ fonts: prefs.fonts });
  document.querySelectorAll(`#ftable input[data-part="${part}"]`).forEach(i => { i.value = ''; delete i.dataset.keep; });
  applyFonts(); refreshSamples();
  return part === 'diagram' ? redrawKeepingPosition() : Promise.resolve();
}

function buildFontRows() {
  const table = $('ftable'); table.textContent = '';
  for (const [part, spec] of Object.entries(FONT_PARTS)) {
    const p = fontPref(part), tr = document.createElement('tr');
    const th = document.createElement('th'); th.textContent = spec.label; tr.appendChild(th);
    // フォント名と大きさは、隣り合わせに置く
    const td = document.createElement('td'), fam = document.createElement('input');
    fam.type = 'text'; fam.setAttribute('list', 'fontlist'); fam.value = p.family || '';
    const dflt = part === 'head' ? '（本文と同じ）' : '既定: ' + spec.family.split(',')[0].replace(/"/g, '');
    fam.placeholder = dflt; fam.dataset.part = part; fam.dataset.kind = 'family'; fam.autocomplete = 'off';
    // 値が入っていると、候補が入力に合うものだけに絞られてしまう。選んだ時点で値を一時的に空欄へ移し、
    // 候補を全部出す（文字を打てば、そのまま絞り込める）。何も選ばず離れたら、元の値に戻す
    fam.addEventListener('focus', () => {
      if (fam.value) { fam.dataset.keep = fam.value; fam.placeholder = fam.value + '（いまの設定）'; fam.value = ''; }
    });
    fam.addEventListener('blur', () => {
      if (!fam.value && fam.dataset.keep) fam.value = fam.dataset.keep;
      delete fam.dataset.keep; fam.placeholder = dflt;
    });
    td.appendChild(fam);
    if (spec.size) {
      td.appendChild(makeNumberBox({ part, kind: 'size', min: spec.min, max: spec.max, value: p.size,
        dflt: () => spec.size, placeholder: String(spec.size) }));
      td.appendChild(document.createTextNode(' px'));
    }
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '既定'; x.title = 'この部分の名前と大きさを、既定に戻す';
    x.style.marginLeft = '6px'; x.onclick = () => resetPart(part);
    td.appendChild(x); tr.appendChild(td);
    const tdX = document.createElement('td'), sm = document.createElement('span');
    sm.dataset.sample = part; sm.textContent = 'あいう Abc'; tdX.appendChild(sm); tr.appendChild(tdX);
    table.appendChild(tr);
    if (part === 'head') {              // 見出し: H1〜H4 それぞれの大きさ。空欄は本文に対する既定の比率
      const r2 = document.createElement('tr'), th2 = document.createElement('th');
      th2.textContent = '見出しの大きさ(px)'; th2.style.fontWeight = '400'; th2.style.fontSize = '12px'; r2.appendChild(th2);
      const td2 = document.createElement('td'); td2.colSpan = 2;
      const hs = p.sizes || {}, names = { h1: '2倍', h2: '1.5倍', h3: '1.17倍', h4: '1倍' };
      for (const l of ['h1', 'h2', 'h3', 'h4']) {
        const lab = document.createElement('span'); lab.textContent = l.toUpperCase() + ' ';
        lab.style.margin = l === 'h1' ? '0 2px 0 0' : '0 2px 0 8px';
        td2.appendChild(lab);
        td2.appendChild(makeNumberBox({ part: 'head', kind: 'hsize', level: l, min: 8, max: 120, value: hs[l],
          dflt: () => Math.round((fontPref('body').size || FONT_PARTS.body.size) * HEAD_DEFAULT_RATIO[l]),
          placeholder: names[l], title: l.toUpperCase() + ' の大きさ(px)。空欄は本文に対する既定の比率（' + names[l] + '）' }));
      }
      r2.appendChild(td2); table.appendChild(r2);
    }
  }
  refreshSamples();
}

async function redrawKeepingPosition() {   // 図は描き直さないと変わらない。読んでいる位置は保つ
  svgCache.clear(); vegaCache.clear();
  await updatePreview();
}
async function onFontInput(e) {
  const t = e.target; if (!t.dataset || !t.dataset.part) return;
  const part = t.dataset.part, spec = FONT_PARTS[part], cur = { ...fontPref(part) };
  if (t.dataset.kind === 'family') cur.family = cssFamily(t.value).replace(/"/g, '');
  else if (t.dataset.kind === 'hsize') {
    const n = Math.round(parseFloat(t.value)), sizes = { ...(cur.sizes || {}) };
    if (isFinite(n)) sizes[t.dataset.level] = Math.min(120, Math.max(8, n)); else delete sizes[t.dataset.level];
    t.value = sizes[t.dataset.level] || ''; cur.sizes = sizes;
  } else {
    const n = Math.round(parseFloat(t.value));
    cur.size = isFinite(n) ? Math.min(spec.max, Math.max(spec.min, n)) : 0;
    t.value = cur.size || '';
  }
  prefs.fonts = { ...prefs.fonts, [part]: cur };
  api.set_prefs({ fonts: prefs.fonts });
  applyFonts(); refreshSamples();
  if (part === 'diagram') await redrawKeepingPosition();
}

$('fveil').addEventListener('mousedown', e => { if (e.target === $('fveil')) closeFontDlg(); });

// ============================================================ 文書を開く・保存する
function applyDocMeta() {
  $('selEnc').value = doc.encoding; $('selNl').value = doc.newline;
  cm.setOption('readOnly', doc.readonly ? true : false);
  document.querySelectorAll('#fmt [data-f], #fmt select, #fmt [data-e=cut], #fmt [data-e=paste]').forEach(el => { el.disabled = doc.readonly; });
  if (typeof finder !== 'undefined' && finder) { $('rrow').hidden = $('rrow').hidden || doc.readonly; }
  updateEditButtons();
}

async function confirmDiscard() {
  if (!isDirty()) return true;
  const i = await ask('変更を保存しますか？', `「${baseName(doc.path)}」には、保存していない変更があります。`,
    [{ label: '保存する', primary: true }, { label: '保存しない' }, { label: 'キャンセル' }]);
  if (i === 0) return await save();
  return i === 1;
}

function loadIntoEditor(text) {
  cm.setValue(text); cm.clearHistory(); cm.markClean(); doc.metaDirty = false;
  cm.setCursor({ line: 0, ch: 0 }); cm.scrollTo(0, 0);
  applyDocMeta(); updateDirty(); updateCounters(); updatePreview(true); renderList();
  $('pscroll').scrollLeft = 0;
}

async function openPath(path) {
  if (!await confirmDiscard()) return;
  const r = await api.read_file(path);
  if (r.error) { showMsg(r.error); return; }
  showMsg('');
  const d = r.doc;
  Object.assign(doc, { path, encoding: d.encoding, newline: d.newline, stamp: d.stamp, readonly: d.readonly });
  loadIntoEditor(d.text);
  if (d.warning) status(d.warning, true, 0);
  else if (d.mixed_newlines) status(`改行が混在していたため、保存すると ${d.newline} にそろいます`, true, 8000);
  else status('');
  if (!folder || !path.toLowerCase().startsWith(folder.toLowerCase() + '\\')) await loadFolder(dirName(path));
  renderList();
}

function resetToBlank() {             // 空の「無題」にする（保存の確認は、呼ぶ側で済ませておく）
  Object.assign(doc, { path: null, encoding: cfg.default_encoding, newline: cfg.default_newline, stamp: null, readonly: false });
  loadIntoEditor(''); status('');
}
async function newDoc() {
  if (!await confirmDiscard()) return;
  resetToBlank();
  cm.focus();
}

async function saveTo(path, stamp) {
  status('保存中…', false, 0);                       // 押したことが分かるように、すぐ表示する
  const r = await api.save(path, cm.getValue(), doc.encoding, doc.newline, stamp);
  if (r.ok) {
    doc.path = path; doc.stamp = r.stamp; cm.markClean(); doc.metaDirty = false;
    updateDirty(); status('保存しました ' + new Date().toLocaleTimeString(), false, 4000);
    if (!folder || !path.toLowerCase().startsWith(folder.toLowerCase() + '\\')) await loadFolder(dirName(path));
    else syncList(true);
    renderList(); return true;
  }
  status('');
  if (r.kind === 'conflict') {
    const i = await ask('他のアプリがこのファイルを変更しています',
      `「${baseName(path)}」は、開いたあとに別の場所で書き換えられました。\n上書きすると、その変更は失われます（上書き前の内容は自動で退避されます）。`,
      [{ label: '上書きして保存', primary: true }, { label: 'キャンセル' }]);
    return i === 0 ? await saveTo(path, null) : false;
  }
  if (r.kind === 'encoding') {
    const i = await ask(`${r.encoding} で表せない文字があります`,
      `次の文字は、${r.encoding} では保存できません:\n${r.chars.join(' ')}\n\n文字コードを UTF-8 に変えて保存しますか？`,
      [{ label: 'UTF-8 に変えて保存', primary: true }, { label: 'キャンセル' }]);
    if (i !== 0) return false;
    doc.encoding = 'UTF-8'; applyDocMeta(); return await saveTo(path, stamp);
  }
  await ask('保存できませんでした', r.message || '原因が分かりません', [{ label: '閉じる', primary: true }]);
  return false;
}

async function save() {
  if (doc.readonly) { await ask('保存できません', 'このファイルは読み取り専用で開いています（文字コードを判定できなかったため）。', [{ label: '閉じる', primary: true }]); return false; }
  if (!doc.path) return await saveAs();
  return await saveTo(doc.path, doc.stamp);
}

// 保存ボタン。押した瞬間（mousedown）に動かす。ボタンを押すと編集欄から焦点が移り、日本語入力の
// 未確定文字の確定なども起きるため、「押して離した」という click を待つと、最初の1回が空振りすることがある。
// 保存の処理中は重ねて動かさない（連打で確認ダイアログが何枚も溜まらないように）
let saveBusy = false;
async function saveClick() {
  if (saveBusy) return;
  saveBusy = true;
  try { return await save(); } finally { saveBusy = false; }
}
$('bSave').addEventListener('mousedown', e => { if (e.button !== 0) return; e.preventDefault(); saveClick(); });
$('bSave').addEventListener('click', e => { if (e.detail === 0) saveClick(); });   // キーボード操作（Enter・Space）

async function saveAs() {
  if (doc.readonly) return await save();
  const p = await api.pick_save(doc.path ? dirName(doc.path) : folder, baseName(doc.path) === '無題' ? '無題.md' : baseName(doc.path));
  if (!p) return false;
  return await saveTo(p, null);   // 保存先を自分で選んだので、競合は確かめない（上書きの確認はダイアログが行う）
}

// 他のアプリでの書き換えを検知する（ウィンドウが前面に戻ったとき）
let checking = false;
async function checkExternal() {
  if (!doc.path || checking || !doc.stamp) return;
  checking = true;
  try {
    const r = await api.check_changed(doc.path);
    if (r.state === 'missing') { status('このファイルは移動または削除されています。保存すると同じ場所に作り直します', true, 0); return; }
    if (JSON.stringify(r.stamp) === JSON.stringify(doc.stamp)) return;
    if (!isDirty()) {
      const rr = await api.read_file(doc.path);
      if (!rr.error) {
        const d = rr.doc, pos = cm.getCursor(), top = cm.getScrollInfo().top;
        Object.assign(doc, { encoding: d.encoding, newline: d.newline, stamp: d.stamp, readonly: d.readonly });
        loadIntoEditor(d.text); cm.setCursor(pos); cm.scrollTo(0, top);
        status('他のアプリでの変更を読み込みました', false, 6000);
      }
      return;
    }
    const i = await ask('他のアプリがこのファイルを変更しました',
      `「${baseName(doc.path)}」は、開いたあとに別の場所で書き換えられました。\nこのウィンドウには、保存していない変更もあります。`,
      [{ label: '変更を捨てて読み込み直す' }, { label: 'このまま編集を続ける', primary: true }]);
    if (i === 0) {
      const rr = await api.read_file(doc.path);
      if (!rr.error) { const d = rr.doc; Object.assign(doc, { encoding: d.encoding, newline: d.newline, stamp: d.stamp, readonly: d.readonly }); loadIntoEditor(d.text); }
    } else {
      doc.stamp = r.stamp;     // 変更を知ったうえで続ける。保存すると相手の変更は上書きされる（退避は残る）
      status('保存すると、他のアプリでの変更は上書きされます（直前の内容は退避されます）', true, 8000);
    }
  } finally { checking = false; }
}

// 閉じるとき（Python から呼ばれる）
async function requestClose() {
  if (!isDirty()) { api.close_now(); return; }
  const i = await ask('変更を保存しますか？', `「${baseName(doc.path)}」には、保存していない変更があります。`,
    [{ label: '保存して閉じる', primary: true }, { label: '保存しないで閉じる' }, { label: 'キャンセル' }]);
  if (i === 0) { if (await save()) api.close_now(); }
  else if (i === 1) api.close_now();
}

// ============================================================ 一覧
function renderList() {
  const q = $('filter').value.trim().toLowerCase();
  const shown = files.filter(f => f.toLowerCase().includes(q));
  $('count').textContent = folder ? `${shown.length} / ${files.length} 件${listTruncated ? '（途中までです）' : ''}` : '';
  $('count').style.color = listTruncated ? '#cf222e' : '';
  $('count').title = listTruncated ? '大きなフォルダーなので、一覧は途中までです。もっと下のフォルダーを選ぶと、全部を出せます' : '';
  const list = $('list'); list.textContent = '';
  let last = null;
  for (const rel of shown) {
    const i = rel.lastIndexOf('/'), dir = i < 0 ? '' : rel.slice(0, i);
    if (!q && dir !== last && (dir || last !== null)) {
      const h = document.createElement('div'); h.className = 'dirhead';
      h.textContent = '📁 ' + (dir || '（このフォルダー直下）'); list.appendChild(h);
    }
    last = dir;
    const full = folder + '\\' + rel.replace(/\//g, '\\');
    const div = document.createElement('div');
    div.className = 'item' + (doc.path && doc.path.toLowerCase() === full.toLowerCase() ? ' sel' : '');
    div.textContent = i < 0 ? rel : rel.slice(i + 1);
    if (q && i >= 0) { const s = document.createElement('span'); s.className = 'dir'; s.textContent = dir; div.appendChild(s); }
    div.onclick = () => openPath(full);
    list.appendChild(div);
  }
}
let listTruncated = false;      // 一覧が、時間か件数の上限で途中までのとき true
async function loadFolder(path) {
  $('count').textContent = '一覧を読み込んでいます…'; $('count').style.color = '';
  const r = await api.list_files(path);
  if (r.error) { showMsg(r.error); return; }
  showMsg(''); folder = path; files = r.files; listTruncated = !!r.truncated;
  $('folder').textContent = path; $('filter').value = ''; renderList();
}
let lastSync = 0;
async function syncList(force) {
  if (!folder || (!force && (listTruncated || Date.now() - lastSync < 1000))) return;   // 途中までの一覧は、前面に戻るたびには読み直さない（「更新」で読み直す）
  lastSync = Date.now();
  const r = await api.list_files(folder);
  if (r.error) { showMsg(r.error); return; }
  listTruncated = !!r.truncated;
  if (JSON.stringify(r.files) !== JSON.stringify(files)) { files = r.files; renderList(); }
}
const samePath = (a, b) => !!a && !!b && a.replace(/[\\/]+$/, '').toLowerCase() === b.replace(/[\\/]+$/, '').toLowerCase();

// 別のフォルダーへ移る。開いていた文書は、そのフォルダーのものではなくなるので閉じる。
// 保存していない変更があれば、先に保存を促す（取り消されたら、フォルダーは移らない）。同じフォルダーなら、一覧を取り直すだけ
async function switchFolder(p) {
  if (samePath(p, folder)) { await loadFolder(p); return true; }
  if (!await confirmDiscard()) return false;
  resetToBlank();
  await loadFolder(p);
  return true;
}
async function chooseFolder() {
  const p = await api.pick_folder(folder || (doc.path ? dirName(doc.path) : null));
  if (p) await switchFolder(p);
}
async function chooseFile() {
  const p = await api.pick_file(doc.path ? dirName(doc.path) : folder);
  if (p) await openPath(p);
}

// ============================================================ 表示の切り替え・幅
// 一覧・編集・プレビューのどれを出すかは、この4つのモードを1か所で切り替える。一覧が出るのは3画面のときだけ
const VIEWS = ['triple', 'split', 'edit', 'preview'];
function setView(mode) {
  if (!VIEWS.includes(mode)) mode = 'triple';
  prefs.view = mode; api.set_prefs({ view: mode });
  const both = mode === 'triple' || mode === 'split';          // 編集とプレビューを並べるモード
  $('side').classList.toggle('hidden', mode !== 'triple');
  $('editorPane').style.display = mode === 'preview' ? 'none' : 'flex';
  $('previewPane').style.display = mode === 'edit' ? 'none' : 'flex';
  $('split').style.display = both ? '' : 'none';
  $('editorPane').style.flex = both ? `0 0 ${(prefs.split || 50)}%` : '1 1 auto';
  for (const [id, m] of [['vTriple', 'triple'], ['vSplit', 'split'], ['vEdit', 'edit'], ['vPrev', 'preview']]) {
    $(id).classList.toggle('active', mode === m);
  }
  cm.refresh(); if (fitMode) setTimeout(fitWidth, 0);
}
function toggleSide() {                 // Ctrl+\ : 一覧の表示／非表示（3画面 ⇄ 2画面）
  setView(prefs.view === 'triple' ? 'split' : 'triple');
}
function setEditorSize(px) {          // Ctrl+ホイール・Ctrl+±・Ctrl+0。フォント設定の「編集欄」の大きさと同じもの
  px = Math.min(FONT_PARTS.editor.max, Math.max(FONT_PARTS.editor.min, px));
  prefs.fonts = { ...prefs.fonts, editor: { ...fontPref('editor'), size: px } };
  api.set_prefs({ fonts: prefs.fonts });
  applyFonts();
  const box = document.querySelector('#ftable input[data-part="editor"][data-kind="size"]');
  if (box) box.value = px;
}

// ---- 書式（Ctrl+B / I / E / K）
const wrapSelection = mark => MdFormat.inline(cm, mark);
const makeLink = () => MdFormat.link(cm);

// 編集ボタン。ボタンを押しても編集欄の選択が外れないよう、押した瞬間の焦点移動を止める
const FORMAT_ACTIONS = {
  bold: () => MdFormat.inline(cm, '**'), italic: () => MdFormat.inline(cm, '*'),
  strike: () => MdFormat.inline(cm, '~~'), code: () => MdFormat.inline(cm, '`'),
  ul: () => MdFormat.linePrefix(cm, 'ul'), ol: () => MdFormat.linePrefix(cm, 'ol'),
  task: () => MdFormat.linePrefix(cm, 'task'), quote: () => MdFormat.linePrefix(cm, 'quote'),
  link: () => MdFormat.link(cm), image: () => MdFormat.image(cm), table: () => MdFormat.table(cm),
  codeblock: () => MdFormat.codeBlock(cm), rule: () => MdFormat.rule(cm),
};
function runFormat(fn) {
  if (doc.readonly) return;
  cm.operation(fn); cm.focus();
}
function setupFormatBar() {
  document.querySelectorAll('#fmt button').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
  document.querySelectorAll('#fmt button[data-f]').forEach(b => {
    b.addEventListener('click', () => runFormat(FORMAT_ACTIONS[b.dataset.f]));
  });
  setupEditBar();
  $('fHead').onchange = () => { const v = $('fHead').value; $('fHead').value = ''; if (v !== '') runFormat(() => MdFormat.heading(cm, +v)); };
  for (const [k, d] of Object.entries(MdFormat.DIAGRAMS)) $('fDiagram').add(new Option(d[0], k));
  for (const [k, c] of Object.entries(MdFormat.CHARTS)) $('fDiagram').add(new Option(c[0], 'chart:' + k));
  $('fDiagram').onchange = () => { const v = $('fDiagram').value; $('fDiagram').value = ''; if (!v) return; runFormat(() => v.startsWith('chart:') ? MdFormat.chart(cm, v.slice(6)) : MdFormat.diagram(cm, v)); };
}

// ============================================================ 検索・置換・コピー・貼り付け
let finder = null;

function updateEditButtons() {
  if (!cm) return;
  const h = cm.historySize();
  document.querySelector('#fmt [data-e=undo]').disabled = doc.readonly || h.undo === 0;
  document.querySelector('#fmt [data-e=redo]').disabled = doc.readonly || h.redo === 0;
}

async function doCopy(cut) {
  const t = cm.getSelection();
  if (!t) { status('コピーする文字を選んでください', false, 2500); return; }
  if (!await api.clipboard_set(t)) { status('クリップボードに書き込めませんでした', true); return; }
  if (cut && !doc.readonly) cm.replaceSelection('');
  status(cut ? '切り取りました' : 'コピーしました', false, 1500);
}
async function doPaste() {
  if (doc.readonly) return;
  const t = await api.clipboard_get();
  if (!t) { status('クリップボードに貼り付けられる文字がありません', true, 3000); return; }
  cm.replaceSelection(t.replace(/\r\n?/g, '\n'), 'end');
}
function openFind(withReplace) {
  if (prefs.view === 'preview') setView('split');     // 検索は編集欄に対して働く
  finder.open(withReplace && !doc.readonly);
}
const EDIT_ACTIONS = {
  undo: () => cm.undo(), redo: () => cm.redo(), cut: () => doCopy(true), copy: () => doCopy(false),
  paste: doPaste, find: () => openFind(false),
};
function setupEditBar() {
  document.querySelectorAll('#fmt button[data-e]').forEach(b => b.addEventListener('click', async () => {
    const act = b.dataset.e;
    await EDIT_ACTIONS[act]();
    if (act !== 'find') cm.focus();
  }));
}

// ---- 右クリックメニュー
function hideCtx() { $('ctx').hidden = true; }
function showCtx(x, y, items) {
  const m = $('ctx'); m.textContent = '';
  for (const it of items) {
    if (it === '-') { const s = document.createElement('div'); s.className = 'csep'; m.appendChild(s); continue; }
    const b = document.createElement('button'); b.className = 'citem'; b.disabled = !!it.disabled;
    const l = document.createElement('span'); l.textContent = it.label;
    const k = document.createElement('span'); k.className = 'ckey'; k.textContent = it.key || '';
    b.append(l, k);
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => { hideCtx(); it.run(); });
    m.appendChild(b);
  }
  m.hidden = false;
  m.style.left = Math.max(4, Math.min(x, innerWidth - m.offsetWidth - 4)) + 'px';
  m.style.top = Math.max(4, Math.min(y, innerHeight - m.offsetHeight - 4)) + 'px';
}
function editorMenu(e) {
  e.preventDefault();
  const sel = !!cm.getSelection(), h = cm.historySize(), ro = doc.readonly;
  showCtx(e.clientX, e.clientY, [
    { label: '元に戻す', key: 'Ctrl+Z', disabled: ro || !h.undo, run: () => { cm.undo(); cm.focus(); } },
    { label: 'やり直し', key: 'Ctrl+Y', disabled: ro || !h.redo, run: () => { cm.redo(); cm.focus(); } },
    '-',
    { label: '切り取り', key: 'Ctrl+X', disabled: ro || !sel, run: async () => { await doCopy(true); cm.focus(); } },
    { label: 'コピー', key: 'Ctrl+C', disabled: !sel, run: async () => { await doCopy(false); cm.focus(); } },
    { label: '貼り付け', key: 'Ctrl+V', disabled: ro, run: async () => { await doPaste(); cm.focus(); } },
    { label: 'すべて選択', key: 'Ctrl+A', run: () => { cm.execCommand('selectAll'); cm.focus(); } },
    '-',
    { label: '検索…', key: 'Ctrl+F', run: () => openFind(false) },
    { label: '置換…', key: 'Ctrl+H', disabled: ro, run: () => openFind(true) },
  ]);
}
function previewMenu(e) {
  e.preventDefault();
  const text = String(window.getSelection());
  showCtx(e.clientX, e.clientY, [
    { label: 'コピー', key: 'Ctrl+C', disabled: !text, run: () => api.clipboard_set(text) },
    { label: 'すべて選択', key: 'Ctrl+A', run: () => { const r = document.createRange(); r.selectNodeContents($('preview')); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } },
  ]);
}

// ============================================================ 印刷・PDF
// 暗い配色の図は紙では読めないので、ダイアログが開いている間だけ明るい配色で描き直す
async function printBeforeDiagrams() {
  const undo = [];
  if (prefs.view === 'edit') { setView('split'); undo.push(() => setView('edit')); }   // 非表示のままでは用紙への収まりを測れない
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const nodes = [...document.querySelectorAll('#preview .diagram[data-src]')];
  if (dark && nodes.length && window.mermaid) {
    const redraw = async theme => {
      window.mermaid.initialize(mermaidConfig(theme));
      for (const d of nodes) {
        try { const { svg } = await window.mermaid.render('mmd' + (++diagramSeq), d.dataset.src, d); d.innerHTML = svg; } catch (e) { /* そのまま */ }
      }
    };
    await redraw('default');
    undo.push(() => redraw('dark'));
  }
  return async () => { for (const f of undo.reverse()) await f(); };
}
function openPrint() {
  if (!cm.getValue().trim()) { status('印刷する内容がありません', true, 3000); return; }
  MdPrint.open();
}

// ============================================================ 起動
document.addEventListener('DOMContentLoaded', () => {
  setupFormatBar();
  cm = CodeMirror.fromTextArea($('ed'), {
    mode: 'markdown', lineNumbers: true, lineWrapping: true, styleActiveLine: true,
    phrases: { 'Jump to line:': '移動する行番号:', '(Use line:column or scroll% syntax)': '（行番号、または 行:列）' },
    indentUnit: 2, tabSize: 4, indentWithTabs: false, placeholder: 'ここに Markdown を書きます',
    extraKeys: {
      Enter: 'newlineAndIndentContinueMarkdownList',
      Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('  ', 'end'),
      'Shift-Tab': c => c.indentSelection('subtract'),
      'Ctrl-B': () => wrapSelection('**'), 'Ctrl-I': () => wrapSelection('*'),
      'Ctrl-E': () => wrapSelection('`'), 'Ctrl-K': () => makeLink(),
      'Ctrl-G': 'jumpToLine',
      'Ctrl-S': () => {}, 'Ctrl-N': () => {}, 'Ctrl-O': () => {},   // アプリ側で処理する
    },
  });
  cm.on('change', () => { followCursor = true; schedulePreview(); updateDirty(); scheduleCounters(); });
  cm.on('cursorActivity', scheduleCounters);
  cm.on('scroll', syncFromTop);
  finder = MdFind.create(cm, { bar: $('find'), rrow: $('rrow'), q: $('fq'), r: $('fr'), cs: $('fCase'), re: $('fRegex'), count: $('fCount') });
  cm.getWrapperElement().addEventListener('contextmenu', editorMenu);
  $('pscroll').addEventListener('contextmenu', previewMenu);
  updateEditButtons();
});

window.addEventListener('pywebviewready', async () => {
  api = window.pywebview.api;
  cfg = await api.get_initial();
  prefs = cfg.prefs || {};
  await MdPrint.init({
    api, content: () => $('preview'), name: () => baseName(doc.path), path: () => doc.path,
    hasDocument: () => cm.getValue().trim().length > 0, beforePrint: printBeforeDiagrams,
    notify: (t, warn) => status(t, warn, 4000),
  });
  for (const e of cfg.encodings) $('selEnc').add(new Option(e, e));
  for (const n of cfg.newlines) $('selNl').add(new Option(n, n));
  doc.encoding = cfg.default_encoding; doc.newline = cfg.default_newline;
  if (prefs.editorSize && !((prefs.fonts || {}).editor || {}).size) {      // 旧版の編集欄の大きさを引き継ぐ
    prefs.fonts = { ...prefs.fonts, editor: { ...fontPref('editor'), size: prefs.editorSize } };
    api.set_prefs({ fonts: prefs.fonts });
  }
  applyFonts();
  if (prefs.zoom) setZoom(prefs.zoom.value, prefs.zoom.fit);
  if (prefs.layout_v !== 2) {          // 旧版: 「2画面」は編集とプレビュー、一覧は別のボタンで隠していた
    const old = prefs.view || 'split';
    prefs.view = old === 'split' ? (prefs.side_hidden ? 'split' : 'triple') : old;
    prefs.layout_v = 2;
    api.set_prefs({ view: prefs.view, layout_v: 2 });
  }
  setView(prefs.view || 'triple');
  applyDocMeta(); updateDirty(); updateCounters(); updatePreview();
  if (cfg.error) showMsg(cfg.error);
  if (cfg.folder) await loadFolder(cfg.folder);
  if (cfg.file) await openPath(cfg.file);
  cm.focus();
  prefsReady = true;
});

// ---- 検索バー
$('fNext').onclick = () => finder.step(1);
$('fPrev').onclick = () => finder.step(-1);
$('fRep').onclick = () => finder.replaceOne();
$('fAll').onclick = () => finder.replaceAll();
$('fClose').onclick = () => finder.close();
$('find').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); finder.close(); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (e.target.id === 'fr') finder.replaceOne();
    else finder.step(e.shiftKey ? -1 : 1);
  }
});
// 画面の余白などで、ブラウザー標準のメニュー（再読み込みなど）を出さない。入力欄では標準のままにする
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.CodeMirror') || e.target.closest('#pscroll') || e.target.closest('#ctx')) return;
  if (e.target.closest('input[type=text], input[type=search], input[type=number]')) return;
  e.preventDefault();
});
document.addEventListener('mousedown', e => { if (!e.target.closest('#ctx')) hideCtx(); }, true);
window.addEventListener('blur', hideCtx);
window.addEventListener('resize', hideCtx);

// ---- ボタン・入力
$('bNew').onclick = newDoc; $('bFolder').onclick = chooseFolder; $('bOpen').onclick = chooseFile;
$('bPrint').onclick = openPrint; $('bSaveAs').onclick = saveAs;
$('bReload').onclick = async () => { await syncList(true); await checkExternal(); };
$('vTriple').onclick = () => setView('triple'); $('vSplit').onclick = () => setView('split');
$('vEdit').onclick = () => setView('edit'); $('vPrev').onclick = () => setView('preview');
$('filter').oninput = renderList;
$('selEnc').onchange = () => { doc.encoding = $('selEnc').value; doc.metaDirty = true; updateDirty(); };
$('selNl').onchange = () => { doc.newline = $('selNl').value; doc.metaDirty = true; updateDirty(); };
$('zOut').onclick = () => zoomBy(1 / 1.1); $('zIn').onclick = () => zoomBy(1.1);
$('z100').onclick = () => setZoom(1, false); $('zFit').onclick = fitWidth;
$('zVal').onchange = () => { const v = parseFloat($('zVal').value); setZoom(isFinite(v) ? v / 100 : zoom, false); };

$('pscroll').addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1); }, { passive: false });
$('editorPane').addEventListener('wheel', e => {
  if (!e.ctrlKey) return; e.preventDefault();
  setEditorSize(edSize() + (e.deltaY < 0 ? 1 : -1));
}, { passive: false });
$('preview').addEventListener('click', async e => {
  const a = e.target.closest('a'); if (!a) return;
  const href = a.getAttribute('href') || ''; e.preventDefault();
  if (href.startsWith('#')) document.getElementById(decodeURIComponent(href.slice(1)))?.scrollIntoView();
  else if (/^(https?:|mailto:)/i.test(href)) api.open_external(href);
  else {
    const p = await api.resolve_link(doc.path, href);
    if (p) { await openPath(p); return; }
    // Markdown 以外（PDF・Word など）は、関連づけられたアプリで開く
    const r = await api.open_local(doc.path, href);
    if (r && r.error) status(r.error, true);
  }
});

// 2画面の境界をドラッグして幅を変える
(() => {
  const split = $('split');
  split.addEventListener('mousedown', e => {
    e.preventDefault(); split.classList.add('drag');
    const rect = $('panes').getBoundingClientRect();
    const move = ev => {
      const pct = Math.min(85, Math.max(15, (ev.clientX - rect.left) / rect.width * 100));
      prefs.split = Math.round(pct); $('editorPane').style.flex = `0 0 ${pct}%`; cm.refresh();
    };
    const up = () => {
      split.classList.remove('drag'); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      api.set_prefs({ split: prefs.split }); if (fitMode) fitWidth();
    };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
})();

let resizeTimer = null;
window.addEventListener('resize', () => { cm && cm.refresh(); if (!fitMode) return; clearTimeout(resizeTimer); resizeTimer = setTimeout(fitWidth, 120); });
window.addEventListener('focus', () => { syncList(); checkExternal(); });

document.addEventListener('keydown', e => {
  if ($('veil').classList.contains('show') || MdPrint.isOpen() || fontDlgOpen()) return;
  const k = e.key.toLowerCase(), c = e.ctrlKey;
  const inEditor = cm && cm.hasFocus();
  if (e.key === 'Escape') hideCtx();
  if (c && !e.shiftKey && k === 'f') { e.preventDefault(); openFind(false); return; }
  if (c && !e.shiftKey && k === 'h') { e.preventDefault(); openFind(true); return; }
  if (e.key === 'F3') { e.preventDefault(); if (!finder.isOpen()) openFind(false); else finder.step(e.shiftKey ? -1 : 1); return; }
  if (c && !e.shiftKey && k === 'p') { e.preventDefault(); openPrint(); }
  else if (c && !e.shiftKey && k === 's') { e.preventDefault(); saveClick(); }
  else if (c && e.shiftKey && k === 's') { e.preventDefault(); saveAs(); }
  else if (c && !e.shiftKey && k === 'n') { e.preventDefault(); newDoc(); }
  else if (c && !e.shiftKey && k === 'o') { e.preventDefault(); chooseFile(); }
  else if (c && e.shiftKey && k === 'o') { e.preventDefault(); chooseFolder(); }
  else if (c && k === '\\') { e.preventDefault(); toggleSide(); }
  else if (c && k === '1') { e.preventDefault(); setView('triple'); }
  else if (c && k === '2') { e.preventDefault(); setView('split'); }
  else if (c && k === '3') { e.preventDefault(); setView('edit'); }
  else if (c && k === '4') { e.preventDefault(); setView('preview'); }
  else if (c && k === '9') { e.preventDefault(); fitWidth(); }
  else if (c && (k === '=' || k === '+' || k === ';')) { e.preventDefault(); inEditor ? setEditorSize(edSize() + 1) : zoomBy(1.1); }
  else if (c && (k === '-' || k === '_')) { e.preventDefault(); inEditor ? setEditorSize(edSize() - 1) : zoomBy(1 / 1.1); }
  else if (c && k === '0') { e.preventDefault(); inEditor ? setEditorSize(FONT_PARTS.editor.size) : setZoom(1, false); }
  else if (e.key === 'F5') { e.preventDefault(); $('bReload').click(); }
}, true);
</script>
</body>
